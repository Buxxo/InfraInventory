<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Infra Inventory</title>
<style>
/* Layout: navy sidebar + content column (option A), data tables with inline edit modals */
:root{
--bg:#F2F5FA;--surface:#FFFFFF;--surface2:#F5F7FB;--ink:#1B2430;--muted:#566275;--line:#E1E6EE;--line2:#EAEEF4;
--accent:#2A5BD7;--accent-ink:#FFFFFF;--accent-soft:#E6EDFD;
--side:#111C36;--side2:#1A2A4E;--side-on:#26396A;--side-ink:#C9D3E3;--side-muted:#9FB0CC;
--ok-bg:#E3F4EA;--ok-fg:#17633D;--warn-bg:#FFF1D6;--warn-fg:#7A4F00;--bad-bg:#FDE7E5;--bad-fg:#A3221B;--off-bg:#E8ECF1;--off-fg:#4A5668;--info-bg:#E4EDFB;--info-fg:#174A94;
--u-esxi:#2F66C4;--u-stor:#B85C00;--u-back:#0F766E;--u-free:#EEF1F6;
--font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
--bg:#0E131A;--surface:#161D27;--surface2:#1B2430;--ink:#E6EDF3;--muted:#9AA7B5;--line:#283241;--line2:#222B38;
--accent:#6AA3FF;--accent-ink:#0B1626;--accent-soft:#1B2C4A;
--side:#0B1220;--side2:#141D30;--side-on:#1E2C4A;
--ok-bg:#12301D;--ok-fg:#56D364;--warn-bg:#3A2E0C;--warn-fg:#E3B341;--bad-bg:#43191A;--bad-fg:#FF9492;--off-bg:#262D36;--off-fg:#A9B4C0;--info-bg:#16294A;--info-fg:#8DBBFF;
--u-esxi:#3F7BDB;--u-stor:#D9822B;--u-back:#2BA39A;--u-free:#1B2430;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 252px;background:var(--side);color:var(--side-ink);padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand i{width:34px;height:34px;border-radius:8px;background:#2F6FDB;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
.brand b{display:block;color:#fff;font-size:15px}
.brand span{display:block;color:var(--side-muted);font-size:12px}
.navlbl{color:var(--side-muted);font-size:11px;letter-spacing:.08em;padding:8px 12px 4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--side-on);color:#fff;font-weight:500}
.nav a em{margin-left:auto;font-style:normal;font-size:11px;min-width:22px;text-align:center;padding:1px 6px;border-radius:9px;background:#43191A;color:#FF9492}
.fresh{margin-top:auto;background:var(--side2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.fresh b{color:#fff;font-size:13px}
.fresh div{display:flex;justify-content:space-between;gap:8px}
.main{flex:999 1 560px;min-width:0;padding:22px 28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.side + .main{padding-left:28px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.head>div:first-child{flex:1 1 340px;min-width:0}
.head>.tools{margin-left:auto;justify-content:flex-end}
.head h1{font-size:25px}
.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.d{color:var(--bad-fg)}
.btn.s{min-height:32px;padding:0 10px;font-size:13px}
.inp{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;min-width:0}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.srch{width:260px;max-width:100%}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{font-size:15px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row>*{flex:1 1 260px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.kpi{flex:1 1 170px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font-size:28px;font-weight:600;line-height:1.1}
.kpi small{font-size:12px;color:var(--muted)}
.kpi small.w{color:var(--warn-fg)}.kpi small.b{color:var(--bad-fg)}.kpi small.g{color:var(--ok-fg)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600;text-align:left;padding:9px 12px;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th[draggable]{cursor:grab}
.lnk{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
.sec{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 -4px}
.fpanel{border-top:1px solid var(--line2);padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.frow2{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.frow2>.inp{width:auto;flex:1 1 150px;min-width:120px}
.vals{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:150px;overflow:auto;flex:2 1 280px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.vals label{display:flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
.fsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--line2)}
.btn:disabled{opacity:.4;cursor:default}
td{padding:9px 12px;border-top:1px solid var(--line2);white-space:nowrap}
#tbl>.note{position:sticky;left:0;width:max-content;max-width:100%}
.tw table{min-width:100%;width:max-content}
.selc{width:38px;min-width:38px!important;max-width:38px;padding-left:12px!important;padding-right:0!important}
.selc input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
table.hasSel td:nth-child(2),table.hasSel th:nth-child(2){position:sticky;left:38px;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line2)}
table.hasSel th:nth-child(2){background:var(--surface2);z-index:4}
tr.picked td{background:var(--accent-soft)!important}
.bulkbar{position:sticky;left:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);width:100%}
.tw{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tw::-webkit-scrollbar{height:10px}.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.tw td{max-width:340px;overflow:hidden;text-overflow:ellipsis}
.tw td,.tw th{min-width:84px}
.card .tw td:first-child,.card .tw th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line2)}
.card .tw th:first-child{background:var(--surface2);z-index:4}
.card .tw tbody tr:hover td:first-child{background:var(--surface2)}
tbody tr:hover{background:var(--surface2)}
tr.clk{cursor:pointer}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)}.b-warn{background:var(--warn-bg);color:var(--warn-fg)}.b-bad{background:var(--bad-bg);color:var(--bad-fg)}.b-off{background:var(--off-bg);color:var(--off-fg)}.b-info{background:var(--info-bg);color:var(--info-fg)}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.w{background:#C98300}.bar i.b{background:#C0392B}
.bl{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.bl div:first-child{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.pending{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 14px;font-weight:500}
.pending .btn{color:var(--ink)}
.pending.ok{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:400;padding:6px 12px;font-size:13px}
#pending{display:flex;flex-direction:column;gap:8px}
#pending:empty{display:none}
.note{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:18px;margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fgrid label.wide{grid-column:1/-1}
.fgrid label.req::after{content:"required";font-size:11px;color:var(--bad-fg)}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;max-width:90vw}
/* rack layout */
.racks{display:flex;gap:12px;min-width:max-content}
.rack{width:var(--rw,150px);flex:0 0 var(--rw,150px)}
.rack h3{font-size:13px;display:flex;justify-content:space-between;margin-bottom:6px}
.rk{display:grid;grid-template-rows:repeat(42,var(--rh,14px));grid-auto-rows:var(--rh,14px);gap:1px;background:var(--line);border:2px solid var(--line);border-radius:4px;padding:1px}
.rk>*{grid-column:1}
.rk .f{background:var(--u-free);font:calc(var(--rf,10px) - 1px)/var(--rh,14px) var(--font);color:var(--muted);padding:0 0 0 3px;overflow:hidden;border:0;text-align:left;cursor:pointer;min-height:0}
.rk .f:hover{background:var(--accent-soft);color:var(--accent)}
.dev{border:0;border-radius:2px;color:#fff;font-size:var(--rf,10px);line-height:1;padding:0 4px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;min-height:0}
.dev.esxi{background:var(--u-esxi)}.dev.stor{background:var(--u-stor)}.dev.back{background:var(--u-back)}
.dev.hit{outline:2px solid var(--bad-fg);outline-offset:-2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
/* heat grid */
.heat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{min-height:62px;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}
.h1{background:var(--info-bg);color:var(--info-fg)}.h2{background:#A9C4F5;color:#0F2F63}.h3{background:#2F66C4;color:#fff}.h4{background:#B85C00;color:#fff}
/* issues */
.cmt{border-top:1px solid var(--line2);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.cmt small{color:var(--muted)}
.pics{display:flex;flex-wrap:wrap;gap:8px}
.pics img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.drop{border:1px dashed var(--line);border-radius:8px;padding:10px;color:var(--muted);font-size:12px}
pre{margin:0;padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:auto;font:12px/1.5 var(--mono)}
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.steps span{padding:8px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.dq{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.dq:first-of-type{border-top:0}
.dq .t{flex:1;min-width:0}
.dq ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12px}
@media (max-width:760px){.side{flex:1 1 100%;padding-bottom:12px}.nav{flex-direction:row;overflow-x:auto}.nav a{white-space:nowrap}.fresh{display:none}.side + .main{padding-left:max(16px,env(safe-area-inset-left,0px))}.main{padding-top:16px}.heat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.seg{display:flex;background:var(--side2);border-radius:9px;padding:3px;margin:0 6px}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:5px 0;font-size:12px;border-radius:7px;color:var(--side-muted)}
.seg input:checked+span{background:var(--side-on);color:#fff;font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.eyebrow{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:16px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.glass{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.glass>*{position:relative}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sumlist{margin:10px 0 14px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}
.cmps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 22px}
.cmp{display:grid;grid-template-columns:110px 1fr 28px;align-items:center;gap:4px 10px;padding:6px 0;text-decoration:none;color:var(--ink);font-size:13px}
.cmp:hover .cl{color:var(--accent)}
.cmp small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-2px}
.cmp .bar i{border-radius:4px}
.tile{text-decoration:none;color:inherit;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.7}
.tile:hover{border-color:var(--accent)}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.dash.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.donutrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend b{color:var(--ink);margin-left:auto;padding-left:10px;font-family:var(--mono);font-weight:500}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 12px;background:var(--line2)}
.stack i{display:block}
.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.risk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.risk:first-of-type{border-top:0}
.risk:hover b{color:var(--accent)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.gcell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.dcrow{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:12px 0}
.rbars{display:flex;gap:6px;align-items:flex-end;height:92px;flex:1 1 220px;min-width:0}
.rb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:14px;height:100%}
.rb .trk{flex:1;width:100%;background:var(--line2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.rb .trk i{display:block;width:100%;border-radius:5px 5px 0 0}
.rb em{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--mono)}
.dcnum{display:flex;gap:18px;flex-wrap:wrap}
.dcnum div{display:flex;flex-direction:column}
.dcnum b{font-size:22px;font-weight:600;line-height:1.1}
.dcnum span{font-size:12px;color:var(--muted)}
.arc{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.seg{animation-name:grow}
@keyframes grow{from{stroke-dasharray:0 var(--c)}}
@media (prefers-reduced-motion:reduce){.arc{animation:none}}
.wkbars{display:flex;gap:8px;align-items:flex-end;height:90px}
.wkbars .rb{height:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{display:block;aspect-ratio:1;border-radius:5px;min-width:0}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .ch{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:2px 4px}
.cd{min-height:86px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;background:var(--surface);min-width:0;overflow:hidden}
.cd.out{border-color:transparent;background:none;cursor:default}
.cd b{font-size:12px;font-weight:600}.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cd.sel{background:var(--line2)}
.ce{display:block;font-size:11px;line-height:1.35;padding:1px 5px;border-radius:4px;color:#fff;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:11px;color:var(--muted)}
.caldet{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.calrow{display:flex;gap:10px;align-items:center;padding:6px 4px;border-radius:6px;color:inherit;text-decoration:none}.calrow:hover{background:var(--line2)}.calrow i{width:8px;height:8px;border-radius:50%;flex:none}
.chkrow{display:flex;align-items:center;gap:8px;font-size:13px;grid-column:1/-1}
@media(max-width:700px){.cd{min-height:56px}.ce{font-size:0;height:6px;padding:0}}
.pgrid{display:grid;grid-template-columns:repeat(var(--n,12),minmax(0,1fr));gap:5px}
.pt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;padding:4px 2px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;font:inherit;min-width:0;overflow:hidden}
.pt i{font-style:normal;font-weight:600;font-size:12px}.pt small{font-size:10px;color:inherit;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt.conn{background:#1f9d6b;border-color:#1f9d6b;color:#fff}.pt.resv{background:#d98a1c;border-color:#d98a1c;color:#fff}.pt.down{background:#cf3b3b;border-color:#cf3b3b;color:#fff}.pt.spare{background:#2f7de1;border-color:#2f7de1;color:#fff}

function load(r){return r['Limit kW']?Math.round(num(r['Power kW'])/num(r['Limit kW'])*100):0}
function dsSync(r){
const s=x=>String(x==null?'':x).trim().toLowerCase();
if(!s(r.Array)&&!s(r['Array volume']))return 'No array data';
if(!DB.Storage.some(a=>s(a.Array)===s(r.Array)))return 'Array not in Storage';
if(r.Type!=='NFS'){if(s(r['LUN ID'])!==s(r['Array LUN ID']))return 'LUN ID mismatch';if(s(r['NAA ID'])!==s(r['Array NAA']))return 'NAA mismatch'}
const a=num(r['Capacity TB']),b=num(r['Array size TB']);if(b&&Math.abs(a-b)/b>0.03)return 'Size mismatch';
return 'OK'}
function val(r,c){return c==='@cjobs'?catJobs(r).join('; '):c==='@crepl'?catRepl(r).join('; '):c==='@members'?DB.Contacts.filter(x=>x['Assignment group']===r.Group).length:c==='@load'?load(r):c==='@sync'?dsSync(r):r[c]}
function ilo(v){v=String(v||'').trim();if(!v)return '';const h=/^https?:\/\//i.test(v)?v:'https://'+v;return '<a class="lnk" href="'+esc(h)+'" target="_blank" rel="noopener noreferrer" title="'+esc(h)+'">iLO ↗</a>'}
function cellHtml(c,r){
const v=val(r,c);
if(c==='iLO URL')return ilo(v)||'<span class="note">—</span>';
if(c==='Last patched'){const p=patchInfo(r);return p.lp?'<span class="badge '+(PCLS[p.st]||'b-off')+'" title="'+p.st+'">'+esc(p.lp)+(p.age!=null?' · '+p.age+' d':'')+'</span>':'<span class="note">—</span>'}
if(c==='FW patched'){const d=daysTo(v);return d===null?'<span class="note">—</span>':esc(String(v).slice(0,10))+' <span class="note">· '+(-d)+' d ago</span>'}
if(c==='Support end'){const d=daysTo(v);if(d===null)return '<span class="note">—</span>';return d<0?'<span class="badge b-bad">Expired · '+esc(v)+'</span>':d<=90?'<span class="badge b-warn">'+esc(v)+' · '+d+' d</span>':'<span class="badge b-ok">'+esc(v)+'</span>'}
if(c==='@sync')return '<span class="badge '+(v==='OK'?'b-ok':v==='No array data'||v==='Array not in Storage'?'b-warn':'b-bad')+'">'+esc(v)+'</span>';
if(c==='@cjobs')return v?esc(v):'<span class="note">—</span>';
if(c==='@crepl')return v?esc(v):'<span class="badge b-warn">Not replicated</span>';
if(c==='Last result')return v===''?'':'<span class="badge '+(v==='OK'?'b-ok':v==='Warning'?'b-warn':v==='Failed'?'b-bad':'b-off')+'">'+esc(v)+'</span>';
if(c==='Replicated')return v===''?'':'<span class="badge '+(v==='Yes'?'b-info':'b-off')+'">'+esc(v)+'</span>';
if(c==='Exported to'){const n=String(v||'').split(/[;,\n]+/).filter(x=>x.trim()).length;return n?'<span class="badge b-info">'+n+'</span> '+esc(v):'<span class="note">—</span>'}
if(c==='Active')return '<span class="badge '+(v==='No'?'b-off':'b-ok')+'">'+(v==='No'?'Inactive':'Active')+'</span>';
if((c==='Email'||c==='Email / DL')&&String(v).indexOf('@')>0)return '<a class="lnk" href="mailto:'+esc(v)+'">'+esc(v)+'</a>';
if(c==='Phone'||c==='Mobile'||c==='Phone / on-call')return v?'<span class="mono">'+esc(v)+'</span>':'';
if(c==='Env')return '<span class="badge '+envCls(v)+'">'+esc(v)+'</span>';
if(['Status','UPS','Cooling','Power','Fire/Leak','Doors','Result','Priority'].includes(c))return v===''?'':'<span class="badge '+stCls(v)+'">'+esc(v)+'</span>';
if(c==='Used %'||c==='@load'){const n=num(v);const k=n>=85?'b':n>=70?'w':'';return '<div style="display:flex;align-items:center;gap:8px;min-width:110px"><div class="bar" style="flex:1"><i class="'+k+'" style="width:'+Math.min(100,n)+'%"></i></div><span class="mono">'+n+'%</span></div>'}
if(c==='Inlet C'){const n=num(v);return '<span class="mono'+(n>=25?'" style="color:var(--bad-fg)':'')+'">'+n.toFixed(1)+'</span>'}
if(MONO.includes(c))return '<span class="mono">'+esc(v)+'</span>';
return esc(v);
}

}
async function exportCsv(sheet,selOnly){

/* ---------- column filters (several conditions, all must match) ---------- */
function fcols(sheet){
const o=SCHEMA[sheet].cols.map(c=>({k:c.k,t:c.t||'text',o:c.o}));
if(TV[sheet])TV[sheet].show.filter(k=>k.charAt(0)==='@').forEach(k=>o.push({k:k,t:k==='@load'?'num':'text'}));
o.push({k:'Updated',t:'date'});
return o;
}
function distinct(sheet,k){
const m={};DB[sheet].forEach(r=>{const x=val(r,k),v=x==null?'':String(x);m[v]=(m[v]||0)+1});
return Object.keys(m).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(v=>({v:v,c:m[v]}));
}
const OPL={contains:'contains',eq:'equals',ne:'does not equal',starts:'starts with',in:'is one of',nin:'is none of',empty:'is empty',nempty:'is not empty',gt:'> greater than',ge:'≥ at least',lt:'< less than',le:'≤ at most',between:'is between',on:'is on',before:'is before',after:'is after',dbetween:'is between',within:'is due within N days (or overdue)',older:'is older than N days'};
function opsFor(sheet,c){
const many=distinct(sheet,c.k).length>40;
let o;
if(c.t==='num')o=['ge','le','between','eq','ne','gt','lt','empty','nempty'];
else if(c.t==='date')o=['on','before','after','dbetween','within','older','empty','nempty'];
else if(c.t==='sel')o=['in','nin','empty','nempty'];
else o=many?['contains','eq','ne','starts','empty','nempty']:['contains','in','nin','eq','ne','starts','empty','nempty'];
if(c.t==='date'){const first=c.k==='Support end'?'within':c.k==='Updated'?'older':null;if(first){o=[first].concat(o.filter(x=>x!==first))}}
return o.map(x=>[x,OPL[x]]);
}
function newFilter(sheet,k){
const c=fcols(sheet).find(x=>x.k===k)||{k:k,t:'text'},op=opsFor(sheet,c)[0][0];
return{k:c.k,op:op,v:(op==='in'||op==='nin')?[]:'',v2:''};
}
function needsValue(f){return !(f.op==='empty'||f.op==='nempty')}
function incomplete(f){
if(!needsValue(f))return false;
if(f.op==='in'||f.op==='nin')return !(Array.isArray(f.v)&&f.v.length);
if(f.op==='between'||f.op==='dbetween')return (f.v==null||f.v==='')&&(f.v2==null||f.v2==='');
return f.v==null||f.v===''||Array.isArray(f.v);
}
function passF(f,r){
if(incomplete(f))return true;
const v=val(r,f.k),s=v==null?'':String(v),sl=s.toLowerCase(),n=parseFloat(s),d10=s.slice(0,10);
const a=parseFloat(f.v),b=parseFloat(f.v2);
switch(f.op){
case 'contains':return sl.indexOf(String(f.v).toLowerCase())>=0;
case 'starts':return sl.indexOf(String(f.v).toLowerCase())===0;
case 'eq':return c_eq(s,n,f.v);
case 'ne':return !c_eq(s,n,f.v);
case 'in':return f.v.indexOf(s)>=0;
case 'nin':return f.v.indexOf(s)<0;
case 'empty':return s.trim()==='';
case 'nempty':return s.trim()!=='';
case 'gt':return !isNaN(n)&&n>a;
case 'ge':return !isNaN(n)&&n>=a;
case 'lt':return !isNaN(n)&&n<a;
case 'le':return !isNaN(n)&&n<=a;
case 'between':return !isNaN(n)&&(isNaN(a)||n>=a)&&(isNaN(b)||n<=b);
case 'on':return d10===f.v;
case 'before':return d10!==''&&d10<f.v;
case 'after':return d10!==''&&d10>f.v;
case 'dbetween':return d10!==''&&(!f.v||d10>=f.v)&&(!f.v2||d10<=f.v2);
case 'within':{const dd=daysTo(s);return dd!==null&&dd<=a}
case 'older':{const dd=daysTo(s);return dd!==null&&-dd>a}
}
return true;
}
function c_eq(s,n,v){const m=parseFloat(v);if(!isNaN(n)&&!isNaN(m)&&String(n)===s.trim())return n===m;return s.toLowerCase()===String(v).toLowerCase()}
function applyFilters(sheet,rows){
const fl=uiOf(sheet).fl.filter(f=>!incomplete(f));
return fl.length?rows.filter(x=>fl.every(f=>passF(f,x.r))):rows;
}
function fdesc(f){
const col=labelOf(f.k),op=OPL[f.op].replace(/^[<>≥≤] /,'');
if(!needsValue(f))return col+' '+op;
if(f.op==='in'||f.op==='nin')return col+' '+op+' '+(f.v.length?f.v.map(x=>x===''?'(empty)':x).join(', '):'…');
if(f.op==='between'||f.op==='dbetween')return col+' '+op+' '+(f.v===''?'…':f.v)+' and '+(f.v2===''||f.v2==null?'…':f.v2);
const sym={gt:'>',ge:'≥',lt:'<',le:'≤'}[f.op];
return col+' '+(sym||op)+' '+(f.v===''?'…':f.v);
}
function fsummaryHtml(sheet){
const fl=uiOf(sheet).fl;if(!fl.length)return '';
return '<div class="fsum" aria-label="Active filters"><span class="note">Filters:</span>'+fl.map((f,i)=>'<span class="badge '+(incomplete(f)?'b-off':'b-info')+'" style="height:26px">'+esc(fdesc(f))+' <button class="btn s" style="min-height:22px;min-width:22px;padding:0 6px;margin-left:4px;font-size:15px;line-height:1;font-weight:700" title="Remove this filter" data-act="frm" data-sheet="'+sheet+'" data-fi="'+i+'" aria-label="Remove filter">×</button></span>').join('')+'<button class="btn s" data-act="fclear" data-sheet="'+sheet+'">Clear all</button></div>';
}
function presets(sheet){
const p=[],has=k=>SCHEMA[sheet].cols.some(c=>c.k===k);
if(has('Support end'))p.push({label:'Support ends within 90 days',f:{k:'Support end',op:'within',v:'90',v2:''}});
if(has('Owner'))p.push({label:'No owner',f:{k:'Owner',op:'empty',v:'',v2:''}});
if(has('Used %'))p.push({label:'Used 85% or more',f:{k:'Used %',op:'ge',v:'85',v2:''}});
if(sheet==='DCMI'){p.push({label:'Power load 80% or more',f:{k:'@load',op:'ge',v:'80',v2:''}});p.push({label:'Inlet 25 °C or more',f:{k:'Inlet C',op:'ge',v:'25',v2:''}})}
if(sheet==='Datastores')p.push({label:'vCenter and array differ',f:{k:'@sync',op:'nin',v:['OK'],v2:''}});
if(sheet==='Datastores'){p.push({label:'Not replicated',f:{k:'Replicated',op:'nin',v:['Yes'],v2:''}});p.push({label:'Not exported to any host',f:{k:'Exported to',op:'empty',v:'',v2:''}})}
if(sheet==='DCChecks')p.push({label:'Result is Issue',f:{k:'Result',op:'in',v:['Issue'],v2:''}});
if(has('Rack')&&has('U start'))p.push({label:'Not placed in a rack',f:{k:'Rack',op:'empty',v:'',v2:''}});
p.push({label:'Not updated for 30+ days',f:{k:'Updated',op:'older',v:'30',v2:''}});
return p;
}
function presetOn(sheet,p){return uiOf(sheet).fl.findIndex(f=>f.k===p.f.k&&f.op===p.f.op&&JSON.stringify(f.v)===JSON.stringify(p.f.v))}
function fpanelHtml(sheet){
const u=uiOf(sheet),cols=fcols(sheet);
const rows=u.fl.map((f,i)=>{
const c=cols.find(x=>x.k===f.k)||{k:f.k,t:'text'};
const ops=opsFor(sheet,c),at=' data-sheet="'+sheet+'" data-fi="'+i+'"';
let val='';
if(f.op==='in'||f.op==='nin'){
val='<div class="vals" role="group" aria-label="Values">'+distinct(sheet,f.k).map((d,vi)=>'<label><input type="checkbox" data-act="fin"'+at+' data-vi="'+vi+'"'+(Array.isArray(f.v)&&f.v.indexOf(d.v)>=0?' checked':'')+'> '+(d.v===''?'(empty)':esc(d.v))+' <span class="note">'+d.c+'</span></label>').join('')+'</div>';
}else if(needsValue(f)){
const tp=(c.t==='num'||f.op==='within'||f.op==='older')?'number':c.t==='date'?'date':'text';
val='<input class="inp" id="fv-'+sheet+'-'+i+'" type="'+tp+'"'+(tp==='number'?' step="any"':'')+' data-act="fval"'+at+' value="'+esc(f.v)+'" aria-label="Filter value"'+((f.op==='between'||f.op==='dbetween')?' placeholder="from"':'')+'>'
+((f.op==='between'||f.op==='dbetween')?'<input class="inp" id="fv2-'+sheet+'-'+i+'" type="'+tp+'"'+(tp==='number'?' step="any"':'')+' data-act="fval2"'+at+' value="'+esc(f.v2)+'" aria-label="Filter value to" placeholder="to">':'');
}
return '<div class="frow2"><select class="inp" data-act="fcol"'+at+' aria-label="Filter column">'+cols.map(x=>'<option value="'+esc(x.k)+'"'+(x.k===f.k?' selected':'')+'>'+esc(labelOf(x.k))+'</option>').join('')+'</select><select class="inp" data-act="fop"'+at+' aria-label="Filter condition">'+ops.map(o=>'<option value="'+o[0]+'"'+(o[0]===f.op?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+val+'<button class="btn s" data-act="frm"'+at+' aria-label="Remove filter">×</button></div>';
}).join('');
return '<div class="fpanel">'+(rows||'<p class="note" style="margin:0">No filters yet. Add a condition, or use a preset. All conditions must match.</p>')+'<div class="tools"><button class="btn s" data-act="fadd" data-sheet="'+sheet+'">+ Add filter</button>'+(u.fl.length?'<button class="btn s" data-act="fclear" data-sheet="'+sheet+'">Clear all</button>':'')+'<span class="note">Presets (click again to remove):</span>'+presets(sheet).map((p,pi)=>'<button class="chip'+(presetOn(sheet,p)>=0?' on':'')+'" aria-pressed="'+(presetOn(sheet,p)>=0)+'" data-act="fpreset" data-sheet="'+sheet+'" data-pi="'+pi+'">'+esc(p.label)+'</button>').join('')+'</div></div>';
}

const PH={x:'/*__'+'XLSX__*/null',m:'/*__'+'META__*/null',s:'/*__'+'STUFF__*/null'};
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const jsonSafe=o=>JSON.stringify(o).replace(/</g,'\\u003c');

/* ---------- DC issue photos: stored as files in Issues/<ID>/ ---------- */
const PIC_URL={};
function dataToBlob(u){const m=/^data:([^;]+);base64,(.*)$/.exec(u),b=atob(m[2]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m[1]})}
async function picExists(dir,n){try{await dir.getFileHandle(n);return true}catch(e){return false}}
async function savePicFiles(issueId,pics){
const top=await ROOT.getDirectoryHandle('Issues',{create:true}),dir=await top.getDirectoryHandle(issueId,{create:true}),names=[],st=nowStr().replace(/\D/g,'').slice(0,12);
for(let i=0;i<pics.length;i++){let n=issueId+'_'+st+'_'+(i+1)+'.jpg',k=1;while(await picExists(dir,n))n=issueId+'_'+st+'_'+(i+1)+'_'+(++k)+'.jpg';
const w=await(await dir.getFileHandle(n,{create:true})).createWritable();await w.write(dataToBlob(pics[i]));await w.close();names.push(n)}
return names}
async function migratePics(){
let n=0;const cs=DB.Comments.filter(c=>c.Pics&&c.Pics.length&&c.Issue);
for(const c of cs){try{const names=await savePicFiles(c.Issue,c.Pics);c.Files=(c.Files||[]).concat(names);n+=c.Pics.length;c.Pics=[]}catch(e){}}
if(n){changed();toast(n+' photo'+(n>1?'s':'')+' moved into the Issues folder. Save to Excel to record the file names.')}return n}
async function loadPics(){
const imgs=Array.prototype.slice.call(document.querySelectorAll('img[data-pf]'));if(!imgs.length)return;
const ok=ROOT&&await rootPerm(false);
for(const im of imgs){const key=im.dataset.pf;
if(PIC_URL[key]){im.src=PIC_URL[key];continue}
if(!ok){const s=document.createElement('span');s.className='note';s.style.cssText='display:inline-block;padding:10px;border:1px dashed var(--line);border-radius:8px';s.textContent='Photo '+key.split('/')[1]+' · connect the project folder to view';im.replaceWith(s);continue}
try{const p=key.split('/'),top=await ROOT.getDirectoryHandle('Issues'),dir=await top.getDirectoryHandle(p[0]),f=await(await dir.getFileHandle(p[1])).getFile();PIC_URL[key]=URL.createObjectURL(f);im.src=PIC_URL[key]}
catch(e){const s=document.createElement('span');s.className='note';s.textContent='Photo file not found: '+key;im.replaceWith(s)}}}

const SHEET_LABEL={ServerMI:'ServersMI',ESXi:'ESXi hosts',Storage:'Storage',Backup:'Backup',Datastores:'Datastores',RackDevices:'Other devices',DCMI:'DCMI',DCChecks:'DC Checks',Issues:'DC Open Issues'};

/* ---------- rack layout ---------- */
function devices(){const o=[];[['ESXi','Hostname','esxi'],['Storage','Array','stor'],['Backup','Device','back'],['RackDevices','Name','cust']].forEach(a=>DB[a[0]].forEach((r,i)=>{if(a[0]==='ESXi'&&inEncl(r))return;o.push({sheet:a[0],i:i,name:r[a[1]],t:a[2],dc:r.DC,rack:r.Rack,u:parseInt(r['U start']),sz:parseInt(r['U size']),r:r})}));return o}
function valid(d){return !isNaN(d.u)&&!isNaN(d.sz)&&d.sz>=1&&d.u>=1&&d.u+d.sz-1<=rackU(d.dc,d.rack)&&dcRacks(d.dc).indexOf(String(d.rack))>=0}
function overlaps(all){const hit=new Set(),pairs=[];const ok=all.filter(valid);for(let a=0;a<ok.length;a++)for(let b=a+1;b<ok.length;b++){const x=ok[a],y=ok[b];if(x.dc===y.dc&&x.rack===y.rack&&x.u<=y.u+y.sz-1&&y.u<=x.u+x.sz-1){hit.add(x.sheet+x.i);hit.add(y.sheet+y.i);pairs.push([x,y])}}return{hit:hit,pairs:pairs}}
const RK={dc:'DC2A',sel:null,z:1},RKZ=[['Compact',136,13,9],['Large',306,16,11],['Extra large',504,22,13]];
const TYPE_LABEL={esxi:'ESXi host',stor:'Storage array',back:'Backup device'};
function devLabel(d){return d.t==='srv'?'Blade server':d.t==='cust'?String(d.r.Type||'Other device'):TYPE_LABEL[d.t]}
function typeColor(name){const t=DB.DeviceTypes.find(x=>x.Name===name);return DT_COLORS[(t&&t.Color)||'Slate']||DT_COLORS.Slate}
function devColor(d){return typeColor(d.r.Type)}
function typeDefU(name){const t=DB.DeviceTypes.find(x=>x.Name===name),n=t?parseInt(t['Default U']):NaN;return n>=1?n:1}

return '<div class="rack"><h3><span><span class="mono">'+rk+'</span> <button class="btn s" style="min-height:24px;padding:0 8px" data-act="rkplace" data-rack="'+rk+'" aria-label="Place a device in '+rk+'">+</button></span><span class="note">'+used+'/'+UH+' U'+(pr?' · '+load(pr)+'% power':'')+'</span></h3><div class="rk">'+cells+'</div>'+(bad.length?'<div class="note" style="color:var(--bad-fg);margin-top:4px">Not placed: '+bad.map(d=>esc(d.name)).join(', ')+'</div>':'')+(!ds_.length?'<div class="note" style="margin-top:4px">Empty rack. Click a U slot to place a device.</div>':'')+'</div>';

const used=all.filter(d=>d.dc===RK.dc&&valid(d)).reduce((s,d)=>s+d.sz,0);
const un=unplaced();
const unHtml='<section class="card"><h2>Unplaced devices</h2>'+(un.length?'<div class="tw"><table><thead><tr><th>Device</th><th>Type</th><th>DC</th><th></th></tr></thead><tbody>'+un.map(d=>'<tr><td class="mono">'+esc(d.name)+'</td><td>'+devLabel(d)+'</td><td>'+esc(d.dc||'—')+'</td><td><button class="btn s" data-act="rkmove" data-sheet="'+d.sheet+'" data-i="'+d.i+'">Place…</button></td></tr>').join('')+'</tbody></table></div>':'<p class="note" style="margin:0">Every device in the inventory has a position.</p>')+'</section>';
return head('DC rack layout','One layout per data center: '+NR+' racks, '+TU+' U in total (add, rename or resize racks in Settings). Click a free U or the + on a rack to place a device. Select a device to move or remove it.','<button class="btn" data-act="rkencl">Add blade enclosure (CS700)</button><div class="chips">'+DCS.map(dc=>'<button class="chip'+(RK.dc===dc?' on':'')+'" data-act="rkdc" data-v="'+dc+'">'+dc+'</button>').join('')+'</div>')
+'<div class="kpis"><div class="kpi"><span>Rack space used · '+RK.dc+'</span><b>'+used+' / '+TU+' U</b><small>'+Math.round(used/(TU||1)*100)+'% of '+NR+' racks</small></div><div class="kpi"><span>Devices placed</span><b>'+all.filter(d=>d.dc===RK.dc&&valid(d)).length+'</b><small>'+all.filter(d=>d.dc===RK.dc&&!valid(d)).length+' without a valid position</small></div><div class="kpi"><span>Position conflicts</span><b>'+ov.pairs.filter(p=>p[0].dc===RK.dc).length+'</b><small class="'+(ov.pairs.some(p=>p[0].dc===RK.dc)?'b':'g')+'">'+(ov.pairs.some(p=>p[0].dc===RK.dc)?'Overlapping devices are outlined in red':'No overlaps')+'</small></div></div>'
+'<section class="card"><div class="tools" style="margin-bottom:10px">Size: '+RKZ.map((z,i)=>'<button class="btn s'+(RK.z===i?' p':'')+'" data-act="rkzoom" data-z="'+i+'">'+z[0]+'</button>').join('')+'<span class="note">Large and Extra large show hostnames in the blade bays. Scroll sideways for more racks.</span></div><div class="leg" style="margin-bottom:12px"><span><i style="background:var(--u-esxi)"></i>ESXi host</span><span><i style="background:var(--u-stor)"></i>Storage array</span><span><i style="background:var(--u-back)"></i>Backup device</span>'+DB.DeviceTypes.filter(t=>t.Active!=='No').map(t=>'<span><i style="background:'+typeColor(t.Name)+'"></i>'+esc(t.Name)+'</span>').join('')+'<span><i style="background:var(--u-free);border:1px solid var(--line)"></i>Free U</span><span>U1 is at the bottom of each rack</span></div><div class="tw"><div class="racks" style="--rw:'+RKZ[RK.z][1]+'px;--rh:'+RKZ[RK.z][2]+'px;--rf:'+RKZ[RK.z][3]+'px">'+(rackHtml||'<p class="note">This data center has no racks yet. Add them in Settings → Racks.</p>')+'</div></div></section>'
+'<section class="card"><h2>Selected device</h2>'+detail+'</section>'+unHtml;
}

+(cm.length?cm.map(c=>'<div class="cmt"><div><b>'+esc(c.Author)+'</b> <small>'+esc(c.Time)+'</small></div>'+(c.Text?'<div style="white-space:pre-wrap">'+esc(c.Text)+'</div>':'')+((c.Pics&&c.Pics.length)||(c.Files&&c.Files.length)?'<div class="pics">'+(c.Files||[]).map(f=>'<img data-pf="'+esc(c.Issue)+'/'+esc(f)+'" alt="Attached photo" data-act="zoom">').join('')+(c.Pics||[]).map(p=>'<img src="'+p+'" alt="Attached photo" data-act="zoom" title="Kept in this browser only. Connect the project folder to store it in the Issues folder.">').join('')+'</div>':'')+'</div>').join(''):'<div class="cmt note">No comments yet.</div>')

+'<div class="row" style="align-items:flex-start"><section class="card" style="flex:1 1 300px;max-width:420px">'+fpanel([fgrp('Status',['Open','New','In progress','Waiting','Resolved','All'].map(f=>({v:f,n:f==='Open'?DB.Issues.filter(x=>x.Status!=='Resolved').length:f==='All'?DB.Issues.length:DB.Issues.filter(x=>x.Status===f).length,on:IS.f===f,act:'isf'})))])+'<div class="note" style="margin:12px 0 8px">'+list.length+' case'+(list.length===1?'':'s')+' shown</div><div style="display:flex;flex-direction:column;gap:8px">'+cases+'</div></section><section class="card" style="flex:2 1 460px">'+detail+'</section></div>';

function drawDraft(){const el=$('cm-pics');if(!el)return;el.innerHTML=DRAFT.pics.map((p,i)=>'<span style="position:relative"><img src="'+p+'" alt="Photo to attach"><button class="btn s" style="position:absolute;top:4px;right:4px;min-height:24px;padding:0 6px" data-act="rmpic" data-i="'+i+'" aria-label="Remove photo">×</button></span>').join('')}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8))};im.onerror=()=>rej(new Error('image'));im.src=fr.result};fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(file)})}
async function addPics(files){for(const f of files){if(!/^image\//.test(f.type))continue;try{DRAFT.pics.push(await shrink(f))}catch(e){toast('Could not read that image')}}drawDraft()}

/* ---------- rack: place, move, remove ---------- */
const PL_DEF={ESXi:2,Storage:6,Backup:4};
const PL_NEW=[['ESXi','New ESXi host'],['Storage','New storage array'],['Backup','New backup device'],['RackDevices','New other device']];
function plNew(){return PL_NEW.concat(DB.DeviceTypes.filter(t=>t.Active!=='No').map(t=>['RackDevices','New '+String(t.Name).toLowerCase(),t.Name]))}
function plSize(sheet,type){return sheet==='RackDevices'?typeDefU(type):(PL_DEF[sheet]||2)}
function devKey(d){return d.sheet+'|'+d.i}
function unplaced(){return devices().filter(d=>!valid(d)||!d.dc||!d.rack)}
function fits(dc,rack,u,sz,skip){
if(!(u>=1)||!(sz>=1))return 'Enter a start U of 1 or more and a size of at least 1';
if(dcRacks(dc).indexOf(String(rack))<0)return (rack||'That rack')+' does not exist in '+dc+' (racks: '+(dcRacks(dc).join(', ')||'none, add them in Settings')+')';
if(u+sz-1>rackU(dc,rack))return 'U'+u+' plus '+sz+' U goes past U'+rackU(dc,rack)+', the top of '+rack;
const c=devices().find(d=>d.dc===dc&&d.rack===rack&&valid(d)&&devKey(d)!==skip&&u<=d.u+d.sz-1&&d.u<=u+sz-1);
return c?'U'+Math.max(u,c.u)+' is already used by '+c.name:'';
}
function firstFree(dc,rack,sz,skip){for(let u=1;u+sz-1<=rackU(dc,rack);u++){if(!fits(dc,rack,u,sz,skip))return u}return 1}
function openPlace(o){
const all=devices(),un=unplaced();
let opts,size;
if(o.key){
const d=all.find(x=>devKey(x)===o.key);size=valid(d)?d.sz:plSize(d.sheet,d.r.Type);
opts='<option value="'+o.key+'" data-size="'+size+'" selected>'+esc(d.name)+' · '+devLabel(d)+'</option>';
}else{
opts=un.map(d=>'<option value="'+devKey(d)+'" data-size="'+(isNaN(d.sz)?plSize(d.sheet,d.r.Type):d.sz)+'">'+esc(d.name)+' · '+devLabel(d)+' (unplaced)</option>').join('')+plNew().map(n=>'<option value="new|'+n[0]+(n[2]?'|'+esc(n[2]):'')+'" data-size="'+plSize(n[0],n[2])+'">'+esc(n[1])+'…</option>').join('');
size=un.length&&!isNaN(un[0].sz)?un[0].sz:(un.length?plSize(un[0].sheet,un[0].r.Type):2);
}
const u=o.u!=null?o.u:firstFree(o.dc,o.rack,size,o.key||'');
$('modal').innerHTML='<div class="modal" data-act="mbg"><div class="dlg" role="dialog" aria-modal="true" aria-label="Place a device in a rack" style="width:min(520px,100%)"><h2>'+(o.key?'Move or place device':'Place a device')+'</h2>'
+'<div class="fgrid"><label class="wide" for="pl-dev">Device<select class="inp" id="pl-dev"'+(o.key?' disabled':'')+'>'+opts+'</select></label>'
+'<label for="pl-dc">Data center<select class="inp" id="pl-dc">'+DCS.map(x=>'<option'+(x===o.dc?' selected':'')+'>'+x+'</option>').join('')+'</select></label>'
+'<label for="pl-rack">Rack<select class="inp" id="pl-rack">'+dcRacks(o.dc||DCS[0]).map(x=>'<option'+(x===o.rack?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'
+'<label for="pl-u">Start U (lowest U the device uses)<input class="inp" id="pl-u" type="number" min="1" value="'+u+'"></label>'
+'<label for="pl-size">Size in U<input class="inp" id="pl-size" type="number" min="1" value="'+size+'"></label></div>'
+'<p class="note" style="margin:0">U1 is the bottom of the rack. The device takes Start U up to Start U + Size − 1. “New …” opens the inventory form with the position filled in. Device types, data centers and rack sizes are managed in Settings.</p>'
+'<div id="pl-err" class="note" style="color:var(--bad-fg)" role="alert"></div>'
+'<div class="acts"><span></span><div class="tools"><button class="btn" data-act="mclose">Cancel</button><button class="btn p" data-act="doplace">Place</button></div></div></div></div>';
const f=$('pl-u');if(f)f.focus();
}
function doPlace(){
const v=$('pl-dev').value,dc=$('pl-dc').value,rack=$('pl-rack').value,u=parseInt($('pl-u').value),sz=parseInt($('pl-size').value);
const isNew=v.indexOf('new|')===0;
const err=fits(dc,rack,u,sz,isNew?'':v);
if(err){$('pl-err').textContent=err;return}
if(isNew){const pp=v.split('|'),pre={DC:dc,Rack:rack,'U start':u,'U size':sz};if(pp[2])pre.Type=pp[2];closeForm();openForm(pp[1],null,pre);return}
const p=v.split('|'),r=DB[p[0]][+p[1]];
r.DC=dc;r.Rack=rack;r['U start']=u;r['U size']=sz;r.Updated=ds(0);
RK.dc=dc;RK.sel={sheet:p[0],i:+p[1]};
closeForm();changed();route();toast((r[SCHEMA[p[0]].key])+' placed in '+dc+' '+rack+' at U'+u);
}
function removeFromRack(sheet,i){

const PT={f:'All',env:'All',q:''},PWARN=14;
function addDays(s,n){const t=new Date(String(s).slice(0,10)+'T00:00:00');t.setDate(t.getDate()+n);return fmt(t)}
function patchInfo(r){
if(srvKind(r)==='Decommissioned')return{st:'Excluded'};
const e=envRow(r.Env),sla=e?parseInt(e['Patch days']):NaN,lp=String(r['Last patched']||'').slice(0,10),dl=daysTo(lp);
if(!(sla>=1))return{st:'No SLA',lp:lp,age:dl===null?null:-dl};
if(dl===null)return{st:'Unknown',sla:sla};
const due=addDays(lp,sla),left=daysTo(due);
return{st:left<0?'Overdue':left<=PWARN?'Due soon':'Compliant',sla:sla,lp:lp,due:due,left:left,age:-dl}}
const PCLS={Compliant:'b-ok','Due soon':'b-warn',Overdue:'b-bad',Unknown:'b-off','No SLA':'b-off',Excluded:'b-off'};
function patchStats(rows){
const c={Compliant:0,'Due soon':0,Overdue:0,Unknown:0,'No SLA':0,Excluded:0};rows.forEach(r=>{c[patchInfo(r).st]++});
const sc=c.Compliant+c['Due soon']+c.Overdue;c.scored=sc;c.pct=sc?Math.round((c.Compliant+c['Due soon'])/sc*100):0;return c}
function patchRows(){
let rows=DB.ServerMI.map((r,i)=>({r:r,i:i,p:patchInfo(r)}));
if(PT.f!=='All')rows=rows.filter(x=>x.p.st===PT.f);
if(PT.env!=='All')rows=rows.filter(x=>x.r.Env===PT.env);

const PT_SRC=[['ServerMI','Hostname','Server'],['ESXi','Hostname','ESXi host'],['Storage','Array','Storage'],['Backup','Device','Backup device'],['RackDevices','Name','Other device']];
function ptParse(txt){const seen={},out=[];String(txt||'').split(/[\r\n\t,;]+|\s+/).forEach(t=>{t=t.trim().replace(/^["']|["']$/g,'');if(t&&!seen[t.toLowerCase()]){seen[t.toLowerCase()]=1;out.push(t)}});return out}
/* Servers are named <hostname>-<role>-<node>: the part before the first dash is the real hostname, so a pasted short name matches. */
function ptMatch(tok){
const t=tok.toLowerCase(),sh=t.split('.')[0],hits=[];
PT_SRC.forEach(s=>DB[s[0]].forEach((r,i)=>{
const ks=(s[0]==='ServerMI'?[r.Hostname,r.FQDN,r['vCenter name']]:[r[s[1]]]).map(x=>String(x||'').toLowerCase()).filter(Boolean);
let ok=ks.indexOf(t)>=0||ks.some(k=>k.split('.')[0]===sh&&(t.indexOf('.')<0||k.indexOf('.')<0));
if(!ok&&s[0]==='ServerMI'&&sh.indexOf('-')<0)ok=ks.some(k=>k.split('.')[0].split('-')[0]===sh);
if(ok)hits.push({sheet:s[0],i:i,name:String(r[s[1]])})}));

toks.forEach(t=>{const h=ptMatch(t);if(!h.length){no.push(t);return}if(h.length>1)multi.push([t,h.length]);h.forEach(x=>{const k=x.sheet+'|'+x.i;if(!seen[k]){seen[k]=1;ok.push(x)}})});

/* ---------- data quality (computed from the data) ---------- */
function sevN(s){return s==='high'?0:s==='medium'?1:2}
function sevCls(s){return s==='high'?'b-bad':s==='medium'?'b-warn':'b-info'}
const SUP=[['ServerMI','Hostname','servermi'],['ESXi','Hostname','esxi'],['Storage','Array','storage'],['Backup','Device','backup'],['RackDevices','Name','otherdevices']];
function quality(){
const out=[];
const add=(id,sev,title,where,items,view)=>out.push({id:id,sev:sev,title:title,where:where,count:items.length,items:items,view:view});
add('owner','high','Servers without an owner','ServersMI · column Owner',DB.ServerMI.filter(r=>!r.Owner).map(r=>r.Hostname),'servermi');
add('nobackup','medium','Servers without a backup job','Backup jobs · assignments vs ServersMI',DB.ServerMI.filter(r=>bjInfo(r).st==='No job').map(r=>r.Hostname),'backupjobs');
add('patchover','high','Servers overdue for patching','ServersMI · Last patched vs Environments · Patch days',DB.ServerMI.filter(r=>patchInfo(r).st==='Overdue').map(r=>r.Hostname+' · '+patchInfo(r).left*-1+' days over'),'patching');
add('patchnone','medium','Servers without a Last patched date','ServersMI · column Last patched',DB.ServerMI.filter(r=>patchInfo(r).st==='Unknown').map(r=>r.Hostname),'patching');
const mip={},mhn={};
DB.ServerMI.forEach(r=>{const ip=String(r.IP||'').trim(),hn=String(r.Hostname||'').trim().toLowerCase();if(ip)(mip[ip]=mip[ip]||[]).push(r.Hostname);if(hn)(mhn[hn]=mhn[hn]||[]).push(r.Hostname)});
add('dupip','high','Duplicate IP addresses','ServersMI · column IP',Object.keys(mip).filter(k=>mip[k].length>1).map(k=>k+' is used by '+mip[k].join(', ')),'servermi');
add('duphn','high','Duplicate hostnames','ServersMI · column Hostname',Object.keys(mhn).filter(k=>mhn[k].length>1).map(k=>k+' appears '+mhn[k].length+' times'),'servermi');
const ex=[],so=[];
SUP.forEach(s=>DB[s[0]].forEach(r=>{const d=daysTo(r['Support end']);if(d===null)return;if(d<0)ex.push(s[0]+' · '+r[s[1]]+' expired '+r['Support end']);else if(d<=90)so.push(s[0]+' · '+r[s[1]]+' ends in '+d+' d')}));
add('expired','high','Support already expired','Support end, all hardware and server sheets',ex,'servermi');
add('soon','medium','Support ends within 90 days','Support end, all hardware and server sheets',so,'servermi');
const all=devices(),ov=overlaps(all);
add('overlap','high','Devices overlapping in a rack','DC, Rack, U start, U size',ov.pairs.map(p=>p[0].name+' and '+p[1].name+' overlap in '+p[0].dc+' '+p[0].rack),'racks');
add('pos','medium','Devices without a valid rack position','DC, Rack, U start, U size (inside the racks and U range of its data center)',all.filter(d=>!valid(d)||!d.dc||!d.rack).map(d=>d.name+' · '+d.sheet),'racks');
const hosts=new Set(DB.ESXi.map(r=>String(r.Hostname)));
add('esxref','medium','Servers pointing to an unknown ESXi host','ServersMI · column ESXi host',DB.ServerMI.filter(r=>r['ESXi host']&&!hosts.has(String(r['ESXi host']))).map(r=>r.Hostname+' → '+r['ESXi host']),'servermi');
add('stale','medium','Sheets not updated for more than 30 days','Updated column of each sheet',Object.keys(SHEET_LABEL).filter(s=>fresh(sheetUpdated(s))[0]==='b-bad').map(s=>SHEET_LABEL[s]+' · last update '+ago(sheetUpdated(s))),'sources');
add('cap','medium','Storage, backup or datastore at 85% or more','Used %',DB.Storage.filter(r=>num(r['Used %'])>=85).map(r=>'Storage · '+r.Array+' '+r['Used %']+'%').concat(DB.Backup.filter(r=>num(r['Used %'])>=85).map(r=>'Backup · '+r.Device+' '+r['Used %']+'%')).concat(DB.Datastores.filter(r=>num(r['Used %'])>=85).map(r=>'Datastore · '+r.Datastore+' '+r['Used %']+'%')),'storage');
add('dssync','high','Datastore values differ between vCenter and the array','Datastores · LUN ID, NAA ID, capacity vs array',DB.Datastores.filter(r=>dsSync(r)!=='OK').map(r=>r.Datastore+' · '+dsSync(r)),'datastores');
add('dsread','medium','vCenter data older than 2 days','Datastores · vCenter read',DB.Datastores.filter(r=>{const d=daysTo(r['vCenter read']);return d===null||d<-2}).map(r=>r.Datastore+' · read '+(r['vCenter read']||'never')),'datastores');
add('kbreview','medium','Knowledge base articles past their review date','KB · Review due',DB.KB.filter(r=>r.Status!=='Outdated'&&daysTo(r['Review due'])!==null&&daysTo(r['Review due'])<0).map(r=>r.ID+' · '+r.Title+' · due '+r['Review due']),'kb');
add('kbres','low','Known issues without a resolution','KB · Resolution',DB.KB.filter(r=>r.Type==='Known issue'&&!String(r.Resolution||'').trim()).map(r=>r.ID+' · '+r.Title),'kb');
add('oiover','medium','Open issues past their due date','Open Issues · Due date',DB.OpenIssues.filter(r=>!oiDone(r)&&daysTo(r['Due date'])!==null&&daysTo(r['Due date'])<0).map(r=>r.ID+' · '+r.Title+' · due '+r['Due date']),'tracker');
add('oiown','medium','High priority open issues without an assignee','Open Issues · Assignee',DB.OpenIssues.filter(r=>!oiDone(r)&&(r.Priority==='High'||r.Priority==='Critical')&&!String(r.Assignee||'').trim()).map(r=>r.ID+' · '+r.Title),'tracker');
add('nodcmi','low','Racks with devices but no DCMI reading','DCMI · DC and Rack',(function(){const k=new Set(DB.DCMI.map(r=>r.DC+'|'+r.Rack));const s=new Set();all.forEach(d=>{const x=d.dc+'|'+d.rack;if(!k.has(x))s.add(d.dc+' '+d.rack)});return Array.from(s)})(),'dcmi');
return out;
}
function completeness(sheet){
const cols=SCHEMA[sheet].cols,rows=DB[sheet];if(!rows.length)return{req:100,all:100};
const f=(cs)=>{if(!cs.length)return 100;let n=0;rows.forEach(r=>cs.forEach(c=>{if(r[c.k]!==''&&r[c.k]!=null)n++}));return Math.round(n/(rows.length*cs.length)*100)};
return{req:f(cols.filter(c=>c.req)),all:f(cols.filter(c=>c.k!=='Notes'&&c.k!=='ID'))};
}

+'<div class="row" style="align-items:flex-start"><section class="card" style="flex:2 1 460px"><h2>Findings</h2>'+(bad.length?bad.map(c=>'<div class="dq"><span class="badge '+sevCls(c.sev)+'" style="min-width:64px;justify-content:center">'+c.sev+'</span><div class="t"><b>'+esc(c.title)+'</b> <span class="badge b-off">'+c.count+'</span><div class="note">'+esc(c.where)+'</div><ul>'+c.items.slice(0,5).map(i=>'<li>'+esc(i)+'</li>').join('')+(c.items.length>5?'<li>and '+(c.items.length-5)+' more</li>':'')+'</ul></div><button class="btn s" data-act="goto" data-v="'+c.view+'">Open</button></div>').join(''):'<div class="empty">No findings.</div>')+'</section>'
+'<div style="flex:1 1 300px;display:flex;flex-direction:column;gap:16px"><section class="card"><h2>Completeness by sheet</h2>'+comp.map(x=>'<div class="bl"><div><span>'+(SHEET_LABEL[x.s]||x.s)+'</span><span class="mono">'+x.c.req+'% required · '+x.c.all+'% all</span></div><div class="bar"><i class="'+(x.c.req<90?'b':x.c.req<100?'w':'')+'" style="width:'+x.c.req+'%"></i></div></div>').join('')+'<p class="note" style="margin:0">Bar shows required fields. “All” counts every column except Notes.</p></section>'
+'<section class="card"><h2>Passed</h2>'+(good.length?good.map(c=>'<div style="display:flex;gap:8px;padding:5px 0"><span class="badge b-ok">OK</span><span>'+esc(c.title)+'</span></div>').join(''):'<div class="empty">Nothing passed yet.</div>')+'</section></div></div>';
}

const PS2=String.raw`# Collect-Datastores.ps1  (needs: VMware.PowerCLI, ImportExcel)  SAMPLE, test it in your environment first
# Reads datastores from every vCenter and matches them with an array export by NAA ID.
# ArrayLuns.csv comes from the storage array (CLI or report), columns: Array,Volume,LunId,Naa,SizeTB
param(
  [string[]]$VCenter  = @('vc-a.corp.example','vc-b.corp.example'),
  [string]$Xlsx       = '.\inventory.xlsx',
  [string]$ArrayCsv   = '.\Inventory\ArrayLuns.csv'
)
Connect-VIServer -Server $VCenter | Out-Null
$arr = @{}
Import-Csv $ArrayCsv | ForEach-Object { $arr[$_.Naa.ToLower()] = $_ }
$notes = @{}
try { Import-Excel $Xlsx -WorksheetName Datastores | ForEach-Object { $notes[$_.Datastore] = $_.Notes } } catch {}
$now = Get-Date -Format 'yyyy-MM-dd HH:mm'
$rows = foreach ($ds in Get-Datastore) {
  $naa = ''; $lun = ''
  if ($ds.Type -eq 'VMFS') {
    $naa = $ds.ExtensionData.Info.Vmfs.Extent[0].DiskName
    $h   = Get-VMHost -Datastore $ds | Select-Object -First 1
    $sl  = Get-ScsiLun -VmHost $h -CanonicalName $naa
    $lun = ((Get-ScsiLunPath -ScsiLun $sl | Select-Object -First 1).LunPath -split ':L')[-1]
  }
  $a   = $arr[$naa.ToLower()]
  $sum = $ds.ExtensionData.Summary
  [pscustomobject][ordered]@{
    'Datastore'      = $ds.Name
    'DC'             = (Get-Datacenter -Datastore $ds | Select-Object -First 1).Name
    'vCenter'        = ($ds.Uid -replace '.*@([^:]+):.*','$1')
    'Cluster'        = (Get-Cluster -Datastore $ds -ErrorAction SilentlyContinue | Select-Object -First 1).Name
    'Type'           = if ($ds.Type -eq 'VMFS') { 'VMFS' + $ds.FileSystemVersion.Split('.')[0] } else { $ds.Type }
    'NAA ID'         = $naa
    'LUN ID'         = $lun
    'Capacity TB'    = [math]::Round($sum.Capacity / 1TB, 2)
    'Free TB'        = [math]::Round($sum.FreeSpace / 1TB, 2)
    'Used %'         = [math]::Round(100 * ($sum.Capacity - $sum.FreeSpace) / $sum.Capacity)
    'Provisioned TB' = [math]::Round(($sum.Capacity - $sum.FreeSpace + $sum.Uncommitted) / 1TB, 2)
    'VMs'            = @($ds.ExtensionData.Vm).Count
    'Hosts'          = @($ds.ExtensionData.Host).Count
    'vCenter read'   = $now
    'Array'          = $a.Array
    'Array volume'   = $a.Volume
    'Array LUN ID'   = $a.LunId
    'Array NAA'      = $a.Naa
    'Array size TB'  = $a.SizeTB
    'Array read'     = (Get-Item $ArrayCsv).LastWriteTime.ToString('yyyy-MM-dd HH:mm')
    'Notes'          = $notes[$ds.Name]
    'Updated'        = Get-Date -Format 'yyyy-MM-dd'
  }
}
$rows | Export-Excel -Path $Xlsx -WorksheetName Datastores -ClearSheet -AutoSize
Disconnect-VIServer -Confirm:$false`;

function doRackBulk(){

let STDIR=null;
const fmtT=d=>fmt(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
function stuffList(){if(!META.stuff)META.stuff=DEMO?[{name:'remote-servers.rds',size:4096,modified:ds(-3)+' 09:20'}]:[];return META.stuff}
async function stuffRefresh(){const out=[];for await(const e of STDIR.entries()){if(e[1].kind==='file'){const f=await e[1].getFile();out.push({name:e[0],size:f.size,modified:fmtT(new Date(f.lastModified))})}}out.sort((a,b)=>a.name.localeCompare(b.name));META.stuff=out;persist()}
async function stuffAdd(files){
let n=0;
try{
for(const f of files){
if(STDIR){const h=await STDIR.getFileHandle(f.name,{create:true}),w=await h.createWritable();await w.write(f);await w.close()}
else{const l=stuffList(),i=l.findIndex(x=>x.name===f.name),e={name:f.name,size:f.size,modified:fmtT(new Date())};if(i>=0)l[i]=e;else l.push(e);persist()}
n++}
if(STDIR)await stuffRefresh();
}catch(e){toast('Could not write the file. Check the folder permission.')}
route();if(n)toast(n+(n===1?' file ':' files ')+(STDIR?'saved to the Stuff folder':'added to the list. Copy it into the Stuff folder yourself.'));
}
async function stuffRemove(name){
try{if(STDIR){await STDIR.removeEntry(name);await stuffRefresh()}else{META.stuff=stuffList().filter(x=>x.name!==name);persist()}}catch(e){toast('Could not remove the file.');return}
route();toast(name+(STDIR?' deleted from the Stuff folder':' removed from the list. Delete the file in the folder too.'));
}

if(el.dataset&&el.dataset.act==='pdprev'){ptdPrev();return}
if(el.name==='Blade'&&el.form&&el.form.id==='frm'){bladeSync(el.form);return}
if(el.id==='csv-sep'){META.csvSep=el.value;persist();return}
if(el.dataset&&el.dataset.act==='bscol'){bsRender(el.dataset.sheet);return}
if(el.id==='pl-dc'){$('pl-rack').innerHTML=dcRacks(el.value).map(x=>'<option>'+esc(x)+'</option>').join('');return}
if(el.id==='att-file'){const fl=Array.prototype.slice.call(el.files||[]);el.value='';if(fl.length)attPicked(fl);return}
if(el.id==='kb-file'){const fl=Array.prototype.slice.call(el.files||[]);el.value='';if(fl.length)kbAttach(fl);return}
if(el.id==='oi-file'){const fl=Array.prototype.slice.call(el.files||[]);el.value='';if(fl.length)oiAttach(fl);return}
if(el.id==='stuff-file'){const fl=Array.prototype.slice.call(el.files||[]);el.value='';if(fl.length)stuffAdd(fl);return}
const fa=el.dataset&&el.dataset.act;
if(fa==='oistatus'){const r=DB.OpenIssues.find(x=>x.ID===OS.sel);if(!r)return;r.Status=el.value;const dn=oiDone(r);r.Resolved=dn?(r.Resolved||ds(0)):'';r.Updated=ds(0);DB.OIComments.push({Issue:r.ID,Time:nowStr(),Author:'System',Type:'Update',Text:'Status changed to '+el.value});changed();route();if(dn&&!String(r.Resolution||'').trim())toast('Status set. Add a resolution so others can find the answer.');return}
if(fa==='bjjob'){BJ.job=el.value;route();return}
if(fa==='lnkchk'){setTick(el.dataset.n,el.checked);route();return}
if(fa==='fcol'){const s=el.dataset.sheet,u=uiOf(s),i=+el.dataset.fi;if(u.fl[i]){u.fl[i]=newFilter(s,el.value);route()}return}
if(fa==='fop'){const s=el.dataset.sheet,f=uiOf(s).fl[+el.dataset.fi];if(f){f.op=el.value;f.v=(f.op==='in'||f.op==='nin')?[]:'';f.v2='';route()}return}
if(fa==='fin'){const s=el.dataset.sheet,f=uiOf(s).fl[+el.dataset.fi],d=f?distinct(s,f.k)[+el.dataset.vi]:null;if(f&&d){if(!Array.isArray(f.v))f.v=[];const i=f.v.indexOf(d.v);if(el.checked&&i<0)f.v.push(d.v);if(!el.checked&&i>=0)f.v.splice(i,1);redrawTable(s);const sm=document.querySelector?document.querySelector('.fsum'):null}return}
if(el.id==='pl-dev'){const o=el.selectedOptions[0];if(o&&o.dataset.size)$('pl-size').value=o.dataset.size;return}
if(el.id==='cm-file'){const fs=Array.from(el.files);el.value='';addPics(fs);return}
if(el.dataset&&el.dataset.act==='isstatus'){const cur=DB.Issues.find(i=>i.ID===IS.sel);if(!cur)return;cur.Status=el.value;cur.Updated=ds(0);DB.Comments.push({Issue:cur.ID,Time:nowStr(),Author:'System',Text:'Status changed to '+el.value,Pics:[]});changed();route()}
});
document.addEventListener('paste',e=>{
if(e.target.id!=='cm-text')return;
const fs=[];const its=(e.clipboardData&&e.clipboardData.items)||[];
for(let i=0;i<its.length;i++){if(its[i].kind==='file'&&/^image\//.test(its[i].type))fs.push(its[i].getAsFile())}
if(fs.length){e.preventDefault();addPics(fs)}
});
document.addEventListener('keydown',e=>{
if(e.key==='Escape'&&$('modal').innerHTML){closeForm();return}
if(e.key==='Enter'&&e.target.tagName==='TR'&&e.target.dataset.act){e.preventDefault();e.target.click()}
});
let dragCol=null,dragSheet=null;
const thOf=e=>e.target&&e.target.closest?e.target.closest('th[data-col]'):null;
document.addEventListener('dragstart',e=>{const th=thOf(e);if(!th)return;dragCol=th.dataset.col;dragSheet=th.dataset.sheet;e.dataTransfer.setData('text/plain',dragCol);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const th=thOf(e);if(th&&dragCol&&th.dataset.sheet===dragSheet){e.preventDefault();e.dataTransfer.dropEffect='move'}});
document.addEventListener('drop',e=>{const th=thOf(e);if(!th||!dragCol||th.dataset.sheet!==dragSheet)return;e.preventDefault();moveColTo(dragSheet,dragCol,th.dataset.col);dragCol=null});
document.addEventListener('dragend',()=>{dragCol=null});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

/* ---------- boot ---------- */
loadState();applySchema();
window.addEventListener('beforeunload',e=>{if(dirty>0){e.preventDefault();e.returnValue=''}});
if(typeof indexedDB!=='undefined')recallHandle('root').then(h=>{if(h&&!ROOT&&typeof h.getDirectoryHandle==='function'){ROOT=h;rootPerm(false).then(ok=>{renderPending();if(ok)rootWire().then(()=>{autoLoadNewer();if(CUR==='sources'||CUR==='stuff'||CUR==='overview')route()}).catch(()=>{});else if(CUR==='sources')route()})}});
if(typeof indexedDB!=='undefined')recallHandle().then(h=>{if(h&&!handle&&typeof h.createWritable==='function'){handle=h;if(!META.fileName)META.fileName=h.name;if(CUR==='sources')route()}});
const fi=document.createElement('input');fi.type='file';fi.accept='.xlsx';fi.id='filein';fi.hidden=true;document.body.appendChild(fi);
fi.addEventListener('change',()=>{if(fi.files[0])importFile(fi.files[0],null);fi.value=''});
(function(){const root=document.documentElement;if(!root||!root.setAttribute)return;const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;let mode='light';
function apply(){const dark=mode==='dark'||(mode==='auto'&&mq&&mq.matches);if(dark)root.setAttribute('data-theme','dark');else root.removeAttribute('data-theme')}
try{mode=localStorage.getItem('infra-theme')||'light'}catch(e){}if(['light','dark','auto'].indexOf(mode)<0)mode='light';
(document.querySelectorAll?document.querySelectorAll('input[name=theme]'):[]).forEach(r=>{r.checked=r.value===mode;r.addEventListener('change',()=>{if(!r.checked)return;mode=r.value;try{localStorage.setItem('infra-theme',mode)}catch(e){}apply()})});
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(mode==='auto')apply()});apply()})();
SNAP=snap();
route();
})();
